version = 1

[build]
language = "python"
framework = "flask"
pythonVersion = "3.12"
installCommand = "pip install -r requirements.txt -c requirements.lock.txt"
buildCommand = "python -m compileall -q server"
startCommand = "uvicorn server.asgi:app --host 0.0.0.0 --port 8000 --no-access-log --log-level warning"
port = 8000
